  <!-- ========== BIO ========== -->
    <h4>Bio</h4>
    <div class="bio‑intro">
      <p>
        I am currently a PhD student in <a href="https://www.engineering.cornell.edu/ece/" target="_blank">Electrical and Computer Engineering</a> at <a href="https://www.cornell.edu" target="_blank">Cornell University</a>, 
        based at the <a href="https://tech.cornell.edu" target="_blank">Cornell Tech Campus</a> in New York City, 
        and am fortunately advised by
        <a href="https://chentianyi1991.github.io" target="_blank">Prof.&nbsp;Tianyi Chen</a>.  
        Prior to that, I have spent four years at the <a href=https://ecse.rpi.edu target='_blank'>Rensselaer Polytechnic Institute</a> and transferred with my advisor.  
        I received my Bachelor of Science degree in Statistics from <a href="https://en.ustc.edu.cn" target="_blank">University of Science and Technology of China</a> in 2020.
      </p>
    </div> 
    
    <div class="bio‑highlight">
      <p>At the core of my research is the question: <strong>How can optimization guide the joint design of data, models, agentic systems, and computing hardware to make AI system more adaptive and efficient?</strong></p>
    </div>

    <div class="bio‑focus">
      <p>My research aims to develop <strong>theoretical foundations and efficient algorithms for bilevel optimization</strong>, where one learning problem or decision-making process is nested within another optimization problem. Specifically, my work spans three directions:</p>
      <ul class="frontiers">
        <li><strong>Optimization Foundations:</strong> using landscape analysis to design provably efficient methods for nonconvex and constrained bilevel problems, with guarantees ranging from stationary convergence to global optimality under suitable structural conditions.</li>
        <li><strong>Generative and Agentic AI:</strong> developing methods that use feedback on model performance to coordinate the adaptation of training data, retrieval, reasoning, and generation.</li>
        <li><strong>Hardware–Algorithm Co-Design:</strong> algorithms that accommodate physical constraints and compensate for hardware nonidealities, with a focus on training for energy-efficient <strong>analog in-memory computing</strong>.</li>
      </ul>
    </div>

    <div class="bio‑closing">
      <p>In the long-term, my research goal is to bridge theory and practice by improving the efficiency and scalability of AI models and developing algorithms tailored to emerging AI hardware architectures.</p>
    </div>

